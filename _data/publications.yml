# Publications shown on the homepage, newest first.
# This file goes in the _data folder: _data/publications.yml
#
# Each paper has:
#   title, authors, journal, year, link   - the reference
#   image                                 - optional; remove the # and point it at an image file
#   blurb                                 - a short plain-language explanation
#
# The blurbs below are DRAFTS written from the paper titles only.
# Please check and rewrite each one before publishing.

- title: "A Unified Perspective On Non-interacting Topology"
  authors: "<strong>d’Ornellas P</strong>, Chaou AY, Grushin AGG"
  journal: "arXiv:2609.07775"
  year: 2026
  link: "https://arxiv.org/abs/2609.07775"
  # image: "/images/pubs/unified-topology.png"
  blurb: >
    Topological materials are usually classified using tools that assume a
    perfect crystal. This paper brings these approaches together into a single
    framework that also works when there is no crystal order at all.

- title: "Leveraging Structural Disorder to Enhance Topological Phases"
  authors: "Gómez Paz L, <strong>d’Ornellas P</strong>, Grushin AGG"
  journal: "arXiv:2606.02476"
  year: 2026
  link: "https://arxiv.org/abs/2606.02476"
  # image: "/images/pubs/structural-disorder.png"
  blurb: >
    Disorder is usually thought of as the enemy of topological phases. We show
    that the right kind of disorder, randomness in where the atoms sit, can
    instead stabilise and strengthen them.

- title: "Topologically Protected Surface Altermagnetism on Antiferromagnets"
  authors: "Leeb V*, <strong>d’Ornellas P*</strong>, De Juan F, Grushin AGG"
  journal: "arXiv:2602.10108, accepted in Phys. Rev. Lett."
  year: 2026
  link: "https://arxiv.org/abs/2602.10108"
  # image: "/images/pubs/surface-altermagnetism.png"
  blurb: >
    Altermagnets are a newly discovered type of magnet: like antiferromagnets
    they have no overall magnetisation, but their electrons behave as if they
    did. We show that the surfaces of some ordinary antiferromagnets act as
    altermagnets, and that this surface effect is protected by topology.

- title: "Altermagnetism Without Crystal Symmetry"
  authors: "<strong>d’Ornellas P*</strong>, Leeb V*, Grushin AGG, Knolle J"
  journal: "Phys. Rev. B 113, 024426"
  year: 2025
  link: "https://doi.org/10.1103/zqnk-153f"
  # image: "/images/pubs/amorphous-altermagnetism.png"
  blurb: >
    Altermagnetism was thought to need particular crystal symmetries. We show
    it can appear spontaneously in amorphous materials, which have no crystal
    structure at all.

- title: "Fractonic Fractional Quantum Hall Effect"
  authors: "Schirmann J*, <strong>d’Ornellas P*</strong>, Grushin AGG"
  journal: "arXiv:2504.18337"
  year: 2025
  link: "https://arxiv.org/abs/2504.18337"
  # image: "/images/pubs/fractonic-fqhe.png"
  blurb: >
    Fractons are exotic particles that cannot move freely on their own. We show
    how fracton behaviour can emerge in the fractional quantum Hall effect, one
    of the best-studied phases of strongly interacting electrons.

- title: "Kitaev–Heisenberg Model on the Star Lattice: From Chiral Majoranas to Chiral Triplons"
  authors: "<strong>d’Ornellas P</strong>, Knolle J"
  journal: "Phys. Rev. B 109 (9), 094421"
  year: 2024
  link: "https://doi.org/10.1103/PhysRevB.109.094421"
  # image: "/images/pubs/star-lattice.png"
  blurb: >
    The Kitaev model describes a quantum spin liquid whose excitations are
    Majorana fermions. On the star lattice we follow what happens as more
    conventional magnetic interactions are added, and find a transition to a
    phase whose excitations are topological triplons instead.

- title: "An Exact Chiral Amorphous Spin Liquid"
  authors: "Cassella G*, <strong>d’Ornellas P*</strong>, Hodson T*, Natori WMH, Knolle J"
  journal: "Nat. Commun. 14 (1), 6663"
  year: 2023
  link: "https://www.nature.com/articles/s41467-023-42105-9"
  # image: "/images/pubs/amorphous-spin-liquid.png"
  blurb: >
    Quantum spin liquids are magnets whose spins never settle into an ordered
    pattern. We show that the Kitaev model, one of the few exactly solvable
    examples, still works on random amorphous lattices, and that there it forms
    a chiral spin liquid.

- title: "Quantised Bulk Conductivity as a Local Chern Marker"
  authors: "<strong>d’Ornellas P</strong>, Barnett R, Lee DKK"
  journal: "Phys. Rev. B 106 (15), 155124"
  year: 2022
  link: "https://link.aps.org/doi/10.1103/PhysRevB.106.155124"
  # image: "/images/pubs/local-chern-marker.png"
  blurb: >
    The Chern number that identifies a topological insulator is normally
    defined for a perfect, infinite crystal. We show it can be measured locally,
    as a quantised conductivity inside the material, so it also works for
    disordered systems.

- title: "Forces Between Kinks in φ<sup>8</sup> Theory"
  authors: "<strong>d’Ornellas P</strong>"
  journal: "J. Phys. Commun. 4 (5), 055014"
  year: 2020
  link: "https://doi.org/10.1088/2399-6528/ab90c2"
  # image: "/images/pubs/kinks.png"
  blurb: >
    Kinks are stable, particle-like solutions in field theory. In φ<sup>8</sup>
    theory they can have long-range tails, and this paper works out the forces
    between them.

- title: "Temporal mode transformations by sequential time and frequency phase modulation for applications in quantum information science"
  authors: "Ashby J, Thiel V, Allgaier M, <strong>d’Ornellas P</strong>, Davis A, Smith B"
  journal: "Opt. Express 28 (25), 38376–38389"
  year: 2020
  link: "https://doi.org/10.1364/OE.410371"
  # image: "/images/pubs/temporal-modes.png"
  blurb: >
    Single photons can carry quantum information in the shape of their pulse
    in time. This paper shows how to reshape these pulses using a sequence of
    time and frequency modulations.

- title: "Single-photon characterization by two-photon spectral interferometry"
  authors: "Thiel V, Davis A, Sun K, <strong>d’Ornellas P</strong>, Jin X, Smith B"
  journal: "Opt. Express 28 (13), 19315–19324"
  year: 2020
  link: "https://doi.org/10.1364/OE.396960"
  # image: "/images/pubs/two-photon-interferometry.png"
  blurb: >
    A technique for measuring the full spectral properties of a single photon
    by interfering it with a second photon.
