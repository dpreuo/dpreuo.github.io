<!-- Drifting periodic Voronoi background.
     Put this file in _includes/ and include it just before </body> in
     _layouts/default.html. Add the class "text-panel" to any box that
     should get a light, see-through background behind its text. -->

<canvas id="voronoi-bg" aria-hidden="true"></canvas>

<style>
  #voronoi-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;        /* fallback for older browsers */
    height: 100lvh;       /* the tallest the window gets on phones (toolbars hidden), so the
                             background doesn't stretch as the toolbars slide in and out */
    z-index: -1;          /* sits behind all page content */
    pointer-events: none; /* clicks pass through to links */
  }

  /* The page background goes on <html> so the canvas shows through <body> */
  html { background: rgb(40, 99, 100); }  /* colour shows only at screen edges on phones; no bounce past the page ends */
  body { background: transparent; }

  /* Always reserve room for the scrollbar, so short pages (no scrollbar) and
     long pages (scrollbar) put the content in exactly the same place */
  html { overflow-y: scroll; }

  /* Crossfade smoothly between pages, in browsers that support it */
  @view-transition { navigation: auto; }

  /* Light, see-through panel behind the page text, for readability.
     Change the last number in the background colour (0.8) to make it
     more or less see-through. */
  .text-panel {
    margin-top: 1.5em;
    background: rgba(255, 255, 255, 0.8);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);          /* softly blurs the cells behind the text */
    padding: 1.5em 2em;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
  }
  @media (max-width: 600px) {
    .text-panel { padding: 1em; border-radius: 0; }
  }

  /* Text drawn in the opposite colour of the background behind it (see
     INVERT_TEXT in the script). The script paints the opposite-coloured
     background as an image on the element, and these rules make that image
     show only through the letters. */
  .invert-text {
    -webkit-background-clip: text;
    background-clip: text;
  }
  .invert-text, .invert-text * {
    color: transparent !important;
    -webkit-text-fill-color: transparent;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
<script>
(function () {
  // ===================== Settings to play with =====================

  // Seeds and motion
  const N = 80;                         // number of seed points (= number of faces)
  const SPEED = 0.1;                    // drift speed in pixels per frame
  const MIN_SPACING = 0.6;              // seeds push each other away when closer than this
                                        // fraction of the typical spacing (0 turns it off)
  const REPULSION = 0.5;                // how sharply seeds turn away from each other

  // Lines
  const LINE = 'rgb(255, 255, 255)';    // edge colour
  const LINE_WIDTH = 3;                 // edge thickness in pixels

  // Faces
  const FILL_FACES = true;              // colour each face
  const PALETTE = [                     // face colours: each face picks one at random
    'rgb(40, 99, 100)',
    'rgb(104, 71, 139)',
    'rgb(106, 81, 83)',
    'rgb(199, 220, 111)',
    'rgb(244, 235, 221)'
  ];
  const FILL_OPACITY = 1;               // face opacity (1 shows the palette colours exactly)
  const COLOUR_JITTER = 13;             // random variation in each tile's colour, on the 0–255
                                        // scale (0 turns it off, around 5–20 is subtle)

  // Shape of the diagram
  const USE_CENTROIDS = false;          // true: after building the Voronoi diagram, move each
                                        // vertex to the centre of mass of its three seed points;
                                        // false: leave it as the ordinary Voronoi diagram

  // Text in the opposite colour of the background behind it: the
  // complementary hue, made light over dark tiles and dark over light ones
  const INVERT_TEXT = '#author-name, #navlist li'; // which text (a CSS selector): here your
                                        // name and each menu item; '' turns it off
  const INVERT_LIGHT = 0.95;            // lightness of text over dark tiles...
  const INVERT_DARK = 0.25;             // ...and over light tiles (0 = black, 1 = white)

  // Extras
  const SHOW_POINTS = false;            // true: also draw the seed points

  // =================================================================

  const canvas = document.getElementById('voronoi-bg');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, pts;
  let R; // repulsion radius in pixels, set from the window size

  // ---------- Geometry on the torus ----------

  // Typical distance between neighbouring seeds is about sqrt(area / N)
  function updateRadius() {
    R = MIN_SPACING * Math.sqrt((w * h) / N);
  }

  // Shortest separation between two seeds on the torus (minimum image)
  function separation(a, b) {
    let dx = a.x - b.x, dy = a.y - b.y;
    dx -= w * Math.round(dx / w);
    dy -= h * Math.round(dy / h);
    return [dx, dy];
  }

  // The seeds live on a torus the size of the background: leaving one edge
  // brings a point back in at the opposite edge.
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    // On phones and tablets, make the background as tall as the whole screen,
    // so it still reaches the bottom when the browser's toolbars shrink away
    // while scrolling (the part hidden behind the toolbars just isn't seen)
    if (window.matchMedia('(pointer: coarse)').matches) {
      canvas.style.height = Math.max(window.screen.height, window.innerHeight) + 'px';
    }
    const shown = canvas.getBoundingClientRect();  // the area the canvas is shown in:
    const newW = shown.width, newH = shown.height; // the window minus any scrollbar
    // nothing to do if the size hasn't really changed (e.g. phone toolbars sliding)
    if (pts && newW === w && newH === h && canvas.width === Math.round(newW * dpr)) return;

    const oldW = w, oldH = h;
    w = newW;
    h = newH;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // keep the seeds in the same relative positions when the window changes size
    if (pts && oldW && oldH) {
      for (const p of pts) { p.x *= w / oldW; p.y *= h / oldH; }
    }
    updateRadius();
  }

  // ---------- Seeds ----------

  // Nudge a colour's red, green and blue values each by a small random amount.
  // The browser first converts any CSS colour (hex, rgb(...), names) to #rrggbb.
  function jitterColour(colour) {
    ctx.fillStyle = colour;
    const hex = ctx.fillStyle;
    if (COLOUR_JITTER <= 0 || hex[0] !== '#') return colour;
    const [r, g, b] = [1, 3, 5].map(i => {
      const c = parseInt(hex.slice(i, i + 2), 16) + (Math.random() * 2 - 1) * COLOUR_JITTER;
      return Math.max(0, Math.min(255, Math.round(c)));
    });
    return `rgb(${r}, ${g}, ${b})`;
  }

  // Start with the seeds already spread out: each new seed is placed at a
  // random spot at least R away from the others (giving up after many tries,
  // so it can never get stuck).
  function init() {
    pts = [];
    for (let n = 0; n < N; n++) {
      let p;
      for (let attempt = 0; attempt < 500; attempt++) {
        p = { x: Math.random() * w, y: Math.random() * h };
        if (pts.every(q => Math.hypot(...separation(p, q)) >= R)) break;
      }
      const angle = Math.random() * 2 * Math.PI;
      p.vx = Math.cos(angle) * SPEED;
      p.vy = Math.sin(angle) * SPEED;
      // each seed keeps a random colour from PALETTE, slightly varied, for its face
      p.color = jitterColour(PALETTE[Math.floor(Math.random() * PALETTE.length)]);
      pts.push(p);
    }
  }

  // Seeds closer than R push each other apart, more strongly the closer they
  // are. The push only turns a seed's direction: its speed is reset to SPEED
  // afterwards, so seeds glance off each other like soft billiard balls
  // instead of piling up or speeding up.
  function step() {
    if (R > 0) {
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const [dx, dy] = separation(pts[i], pts[j]);
          const d = Math.hypot(dx, dy);
          if (d >= R || d === 0) continue;
          const f = REPULSION * (1 - d / R) / d; // stronger when closer
          pts[i].vx += f * dx; pts[i].vy += f * dy;
          pts[j].vx -= f * dx; pts[j].vy -= f * dy;
        }
      }
    }
    for (const p of pts) {
      const v = Math.hypot(p.vx, p.vy) || 1;
      p.vx *= SPEED / v;
      p.vy *= SPEED / v;
      p.x = (p.x + p.vx + w) % w;
      p.y = (p.y + p.vy + h) % h;
    }
  }

  // ---------- Carry the background over between pages ----------
  // When the visitor leaves a page, the seeds are saved in the browser tab's
  // session storage; the next page picks them up and carries on from there.
  // Positions are stored as fractions of the window size. A new tab, or a
  // change to N, the palette, the opacity or the jitter, starts a fresh
  // random pattern.
  const STORE_KEY = 'voronoi-bg-state';
  const SETTINGS = `${N}|${PALETTE.join(',')}|${FILL_OPACITY}|${COLOUR_JITTER}`;

  function saveState() {
    try {
      sessionStorage.setItem(STORE_KEY, JSON.stringify({
        settings: SETTINGS,
        pts: pts.map(p => [p.x / w, p.y / h, p.vx, p.vy, p.color])
      }));
    } catch (e) { /* storage unavailable: just start fresh next time */ }
  }

  function loadState() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(STORE_KEY));
      if (!saved || saved.settings !== SETTINGS || saved.pts.length !== N) return false;
      pts = saved.pts.map(([x, y, vx, vy, color]) => ({ x: x * w, y: y * h, vx, vy, color }));
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---------- Building the diagram ----------

  // Periodic images: the seeds plus their copies shifted by one window
  // width and/or height in every direction (a 3 x 3 block of tiles).
  // The diagram inside the central tile is then the periodic Voronoi diagram.
  function periodicPoints() {
    const out = [];
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        for (const p of pts) out.push([p.x + i * w, p.y + j * h]);
      }
    }
    return out;
  }

  // Step 1: build the Voronoi diagram as a graph.
  // Each Voronoi vertex belongs to one Delaunay triangle and starts at that
  // triangle's circumcentre. Each Voronoi edge joins the vertices of two
  // triangles that share a side.
  function buildVoronoi(delaunay) {
    const { triangles, halfedges } = delaunay;
    const nT = triangles.length / 3;
    const cc = delaunay.voronoi([-w, -h, 2 * w, 2 * h]).circumcenters;

    const vx = new Float64Array(nT);
    const vy = new Float64Array(nT);
    for (let t = 0; t < nT; t++) {
      vx[t] = cc[2 * t];
      vy[t] = cc[2 * t + 1];
    }

    const edges = []; // pairs of vertex indices [t, u]
    for (let e = 0; e < halfedges.length; e++) {
      const o = halfedges[e];
      if (o > e) edges.push([Math.floor(e / 3), Math.floor(o / 3)]);
    }
    return { vx, vy, edges };
  }

  // Step 2 (optional): move each vertex to the centre of mass of its three
  // seeds. Only the vertex positions change; the edge list is untouched, so
  // the connectivity of the diagram is exactly preserved. The three seeds are
  // the periodic images nearest the vertex, so the centre of mass is taken
  // correctly across the window edges.
  function moveVerticesToCentroids(graph, delaunay) {
    const { points, triangles } = delaunay;
    for (let t = 0; t < graph.vx.length; t++) {
      const a = triangles[3 * t], b = triangles[3 * t + 1], c = triangles[3 * t + 2];
      graph.vx[t] = (points[2 * a] + points[2 * b] + points[2 * c]) / 3;
      graph.vy[t] = (points[2 * a + 1] + points[2 * b + 1] + points[2 * c + 1]) / 3;
    }
  }

  // ---------- Drawing ----------

  // Fill each face with its seed's colour. The face around a seed is the
  // polygon through the vertices of the triangles surrounding that seed,
  // taken in order, so it follows any vertices moved in step 2. Periodic
  // copies of a seed share its colour, so faces match up across the edges.
  function fillFaces(graph, delaunay) {
    const { halfedges, inedges } = delaunay;
    const { vx, vy } = graph;
    ctx.globalAlpha = FILL_OPACITY;
    for (let i = 0; i < inedges.length; i++) {
      const start = inedges[i];
      if (start === -1) continue;

      // walk around seed i, collecting the triangles (= vertices) in order
      const face = [];
      let e = start;
      let closed = true;
      do {
        face.push(Math.floor(e / 3));
        const out = e % 3 === 2 ? e - 2 : e + 1; // next half-edge, leaving seed i
        e = halfedges[out];
        if (e === -1) { closed = false; break; }  // outer edge of the 3 x 3 block: skip
      } while (e !== start);
      if (!closed) continue;

      // skip faces that don't reach into the window
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const t of face) {
        minX = Math.min(minX, vx[t]); maxX = Math.max(maxX, vx[t]);
        minY = Math.min(minY, vy[t]); maxY = Math.max(maxY, vy[t]);
      }
      if (maxX < 0 || minX > w || maxY < 0 || minY > h) continue;

      ctx.beginPath();
      ctx.moveTo(vx[face[0]], vy[face[0]]);
      for (let k = 1; k < face.length; k++) ctx.lineTo(vx[face[k]], vy[face[k]]);
      ctx.closePath();
      ctx.fillStyle = pts[i % N].color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Trace only edges that touch the window; the rest are periodic copies.
  function traceEdges(graph) {
    const { vx, vy, edges } = graph;
    for (const [t, u] of edges) {
      const x1 = vx[t], y1 = vy[t], x2 = vx[u], y2 = vy[u];
      if (Math.max(x1, x2) < 0 || Math.min(x1, x2) > w ||
          Math.max(y1, y2) < 0 || Math.min(y1, y2) > h) continue;
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    const delaunay = d3.Delaunay.from(periodicPoints());

    const graph = buildVoronoi(delaunay);                         // step 1
    if (USE_CENTROIDS) moveVerticesToCentroids(graph, delaunay);  // step 2

    // faces first, then the lines on top of them
    if (FILL_FACES) fillFaces(graph, delaunay);

    ctx.beginPath();
    traceEdges(graph);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = LINE_WIDTH;
    ctx.stroke();

    if (SHOW_POINTS) {
      ctx.beginPath();
      for (const p of pts) {
        ctx.moveTo(p.x + 1.5, p.y);
        ctx.arc(p.x, p.y, 1.5, 0, 2 * Math.PI);
      }
      ctx.fillStyle = LINE;
      ctx.fill();
    }
  }

  // ---------- Text in the opposite colour of the background ----------

  // Conversions between sRGB (0–255) and OKLab, a colour space where equal
  // steps look equally different to the eye: L is lightness (0 to 1), and
  // a and b give the hue and colourfulness.
  function toOklab([r, g, b]) {
    const lin = c => (c /= 255) <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    const [R, G, B] = [r, g, b].map(lin);
    const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B);
    const m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B);
    const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }

  function fromOklab([L, a, b]) {
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    const R = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
    const G = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
    const B = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
    const enc = c => {
      c = Math.max(0, Math.min(1, c));
      return Math.round(255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055));
    };
    return [enc(R), enc(G), enc(B)];
  }

  // The opposite of a background colour: the complementary hue (a, b -> -a, -b),
  // light over dark backgrounds and dark over light ones. The background only
  // has a handful of colours, so each answer is remembered rather than
  // recalculated for every pixel.
  const oppositeCache = new Map();
  function oppositeColour(r, g, b) {
    const key = (r << 16) | (g << 8) | b;
    let out = oppositeCache.get(key);
    if (!out) {
      const [L, A, B] = toOklab([r, g, b]);
      out = fromOklab([L < 0.62 ? INVERT_LIGHT : INVERT_DARK, -A, -B]);
      if (oppositeCache.size > 50000) oppositeCache.clear();
      oppositeCache.set(key, out);
    }
    return out;
  }

  // For each chosen piece of text: copy the background pixels behind it,
  // replace every pixel with its opposite colour, and set the result as the
  // element's background image, which shows only through the letters.
  const invertEls = INVERT_TEXT ? Array.from(document.querySelectorAll(INVERT_TEXT)) : [];
  for (const el of invertEls) el.classList.add('invert-text');
  const scratch = document.createElement('canvas');
  const sctx = scratch.getContext('2d');

  function updateInvertedText() {
    if (!invertEls.length) return;
    const dpr = canvas.width / w;
    for (const el of invertEls) {
      const r = el.getBoundingClientRect();
      // an element with no size can't be painted this way: show its text normally
      if (r.width < 1 || r.height < 1) { el.classList.remove('invert-text'); continue; }
      el.classList.add('invert-text');
      const x0 = Math.max(0, Math.floor(r.left * dpr)), x1 = Math.min(canvas.width, Math.ceil(r.right * dpr));
      const y0 = Math.max(0, Math.floor(r.top * dpr)), y1 = Math.min(canvas.height, Math.ceil(r.bottom * dpr));
      if (x1 <= x0 || y1 <= y0) continue; // scrolled out of view

      const cols = x1 - x0, rows = y1 - y0;
      const img = ctx.getImageData(x0, y0, cols, rows);
      const d = img.data;
      for (let k = 0; k < d.length; k += 4) {
        const a = d[k + 3] / 255;            // see-through parts of the canvas show
        const [or, og, ob] = oppositeColour( // the white page background
          Math.round(d[k] * a + 255 * (1 - a)),
          Math.round(d[k + 1] * a + 255 * (1 - a)),
          Math.round(d[k + 2] * a + 255 * (1 - a)));
        d[k] = or; d[k + 1] = og; d[k + 2] = ob; d[k + 3] = 255;
      }
      scratch.width = cols;
      scratch.height = rows;
      sctx.putImageData(img, 0, 0);
      const url = `url(${scratch.toDataURL()})`;

      // keep the previous image underneath the new one, so the text never
      // goes blank while the browser is loading the new image
      const size = `${cols / dpr}px ${rows / dpr}px`;
      const pos = `${x0 / dpr - r.left}px ${y0 / dpr - r.top}px`;
      el.style.backgroundImage = el._invertUrl ? `${url}, ${el._invertUrl}` : url;
      el.style.backgroundSize = `${size}, ${size}`;
      el.style.backgroundPosition = `${pos}, ${pos}`;
      el.style.backgroundRepeat = 'no-repeat';
      el._invertUrl = url;
    }
  }

  // ---------- Run ----------

  let frame = 0;
  function loop() {
    step();
    draw();
    if (frame++ % 2 === 0) updateInvertedText(); // 30 times a second
    requestAnimationFrame(loop);
  }

  resize();
  if (!loadState()) init();
  window.addEventListener('resize', () => { resize(); draw(); updateInvertedText(); });
  window.addEventListener('scroll', updateInvertedText, { passive: true });
  window.addEventListener('pagehide', saveState);

  // Visitors who have asked their system for less motion get a still diagram
  if (reduceMotion) {
    draw();
    updateInvertedText();
  } else {
    loop();
  }
})();
</script>
